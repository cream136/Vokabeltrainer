<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vokabeltrainer">
  <!-- <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"> -->
  <!-- <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"> -->
  <!-- <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"> -->
  <title>Vokabeltrainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- ══ Seitenleiste: Verwaltung, Wörter, Statistik ══════════════════════ -->
    <aside class="sidebar">
      <h1>Vokabeltrainer</h1>

      <section class="side-section" id="dataset-section">
        <h2>Dataset verwalten</h2>
        <div class="side-row">
          <label for="dataset-name">Neu erstellen</label>
          <input id="dataset-name" type="text" placeholder="Name ohne Extension" autocomplete="off">
          <button id="create-dataset-btn">Erstellen</button>
        </div>
        <div class="side-row">
          <label for="dataset-rename">Umbenennen</label>
          <input id="dataset-rename" type="text" placeholder="Neuer Name ohne Extension" autocomplete="off">
          <button id="rename-dataset-btn">Umbenennen</button>
        </div>
        <button id="delete-dataset-btn" class="danger">Aktuelles Dataset löschen</button>
      </section>

      <section class="side-section" id="addword-section">
        <h2>Wort hinzufügen</h2>
        <p class="side-note">Englisches Wort + deutsche Übersetzung.</p>
        <div class="add-col">
          <input type="text" id="new-english" placeholder="English" autocomplete="off">
          <input type="text" id="new-german" placeholder="German" autocomplete="off">
          <button id="add-word-btn">Hinzufügen</button>
        </div>
      </section>

      <section class="side-section" id="stats-section">
        <h2>Statistik</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span>Richtig</span>
            <strong id="correct-count">0</strong>
            <div class="word-list" id="correct-words"></div>
          </div>
          <div class="stat-card">
            <span>Falsch</span>
            <strong id="incorrect-count">0</strong>
            <div class="word-list" id="incorrect-words"></div>
          </div>
          <div class="stat-card">
            <span>Versuche</span>
            <strong id="total-count">0</strong>
          </div>
          <div class="stat-card">
            <span id="total-words-label">Wörter gesamt</span>
            <strong id="total-words">0</strong>
          </div>
        </div>
      </section>
    </aside>

    <!-- ══ Hauptbereich: Quiz steht oben ═══════════════════════════════════ -->
    <main class="main">
      <div class="topbar">
        <div class="topbar-field">
          <span class="topbar-field-label">Lernmodus</span>
          <div class="seg" id="mode-toggle">
            <button type="button" class="seg-btn active" data-mode="words">Wörter</button>
            <button type="button" class="seg-btn" data-mode="tenses">Zeitformen</button>
          </div>
        </div>
        <div class="topbar-field" id="dataset-field">
          <label for="dataset-select">Dataset</label>
          <select id="dataset-select"></select>
        </div>
        <div class="topbar-field" id="direction-field">
          <label for="direction-select">Lernrichtung</label>
          <select id="direction-select">
            <option value="de-en">Deutsch → Englisch</option>
            <option value="en-de">Englisch → Deutsch</option>
          </select>
        </div>
        <div class="topbar-field hidden" id="target-field">
          <label for="verb-target-select">Frageart</label>
          <select id="verb-target-select">
            <option value="all" selected>Alle 3 (Form 1 → Form 2 → Bedeutung)</option>
            <option value="past">Simple Past (1. Form)</option>
            <option value="participle">Past Participle (2. Form)</option>
            <option value="meaning">Bedeutung (Deutsch)</option>
          </select>
        </div>
      </div>

      <section class="quiz-card">
        <div id="direction-banner" class="direction-banner">Deutsch → Englisch</div>
        <div id="word-container">
          <div class="word-pair">
            <div class="input-group">
              <label for="english-word" class="field-label" id="question-label">Deutsch</label>
              <span id="english-word" class="question-word">Lädt...</span>
            </div>
            <div class="input-group">
              <label for="german-input" class="field-label" id="answer-label">Englisch</label>
              <input type="text" id="german-input" placeholder="Deutsche Übersetzung" autocomplete="off">
            </div>
            <button id="check-btn">Prüfen</button>
          </div>
          <div id="result"></div>
        </div>

        <div class="button-row">
          <button id="next-btn" class="hidden">Nächstes Wort</button>
          <button id="next-question-btn" class="secondary">Nächste Frage</button>
          <button id="restart-btn" class="secondary">Neu starten</button>
          <button id="finish-btn" class="danger">Beenden</button>
        </div>
      </section>

      <!-- KI-Hilfe -->
      <div id="ai-panel" class="ai-panel">
        <div class="ai-header">
          <span class="ai-icon">✨</span>
          <span class="ai-title">KI-Hilfe</span>
        </div>
        <div class="ai-body">
          <p class="ai-desc">Frage den KI-Assistenten zu Konjugation, Beispielsätzen und Synonymen.</p>
          <button id="ai-btn" type="button" class="ai-trigger-btn">
            <span id="ai-btn-label">KI-Info anfragen</span>
            <span id="ai-spinner" class="ai-spinner hidden"></span>
          </button>
          <div id="ai-result" class="ai-result hidden"></div>
        </div>
      </div>

      <section class="preview-panel">
        <h2>Vorschau</h2>
        <div id="upcoming-list" class="upcoming-list">
          <div class="upcoming-item">Lädt...</div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
